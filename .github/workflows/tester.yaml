name: qa

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['master', 'release-*']
  workflow_dispatch: {}

jobs:

  initialize:
    uses: ./.github/workflows/core--initializer.yaml

  debug-windows:
    needs: [initialize]
    if: contains(fromJSON(needs.initialize.outputs.platforms), 'windows-latest')
    runs-on: windows-latest
    steps:

      - name: Prepare Python
        uses: emcd/python-project-common/.github/actions/python-hatch@master
        with:
          python-version: '3.10'

      - name: Debug Environment
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          v=py3.10

          echo "=== Python Environment Debug ==="
          python --version
          which python

          echo "=== Hatch Environment Debug ==="
          hatch env show qa.${v}

          echo "=== Module Resolution Test ==="
          hatch --env "qa.${v}" run python -c "import sphinx.cmd.build; print('Sphinx module found')" || echo "Sphinx import failed"
          hatch --env "qa.${v}" run python -m sphinx.cmd.build --version || echo "Sphinx module execution failed"

          echo "=== Coverage + Sphinx Test ==="
          hatch --env "qa.${v}" run coverage --version
          echo "import sphinx.cmd.build; print('Coverage + Sphinx works')" > .auxiliary/test_coverage_sphinx.py
          hatch --env "qa.${v}" run coverage run --source=. .auxiliary/test_coverage_sphinx.py || echo "Coverage + Sphinx failed"

          echo "=== Optional Dependencies Check ==="
          echo "Probing for libmagic DLL availability..."
          hatch --env "qa.${v}" run python -c "
          import ctypes
          import os
          import sys

          # Common libmagic DLL names on Windows
          dll_names = ['magic1.dll', 'libmagic-1.dll', 'magic.dll', 'cygmagic-1.dll']
          found = False

          for dll in dll_names:
              try:
                  lib = ctypes.CDLL(dll)
                  print(f'Found libmagic: {dll}')
                  found = True
                  break
              except OSError:
                  continue

          if not found:
              print('No libmagic DLL found - this may cause python-magic import to hang')

          # Test if python-magic package is installed by checking importability
          try:
              import importlib.util
              spec = importlib.util.find_spec('magic')
              if spec is not None:
                  print('python-magic package is available for import')
              else:
                  print('python-magic package not found')
          except Exception as e:
              print(f'Error checking python-magic availability: {e}')
          " || echo "DLL probe failed"

          echo "Testing puremagic import..."
          hatch --env "qa.${v}" run python -c "import puremagic; print('puremagic available')" || echo "puremagic not available"

      - name: Test Sphinx Without Coverage
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          v=py3.10

          echo "=== Pre-Sphinx Environment Check ==="
          echo "Working directory: $(pwd)"
          echo "Hatch env location:"
          hatch --env "qa.${v}" run python -c "import sys; print(sys.executable)"

          echo "=== Creating output directories ==="
          mkdir -p .auxiliary/caches/sphinx .auxiliary/artifacts/sphinx-doctest
          ls -la .auxiliary/

          echo "=== Testing Sphinx module directly ==="
          hatch --env "qa.${v}" run python -c "from sphinx.cmd.build import main; print('Sphinx build module imported')"

          echo "=== Running Sphinx command ==="
          hatch --env "qa.${v}" run python -m sphinx.cmd.build \
            -E -b doctest -d .auxiliary/caches/sphinx --quiet \
            documentation .auxiliary/artifacts/sphinx-doctest || echo "Sphinx command failed"

      - name: Test Coverage + Sphinx Direct
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          v=py3.10
          echo "=== Testing Coverage + Sphinx Direct Command ==="
          hatch --env "qa.${v}" run coverage run -m sphinx.cmd.build \
            -E -b doctest -d .auxiliary/caches/sphinx --quiet \
            documentation .auxiliary/artifacts/sphinx-doctest || echo "Coverage + Sphinx direct failed"

      - name: Test Hatch Script Context
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          v=py3.10
          echo "=== Testing Hatch Script Execution ==="
          hatch --env "qa.${v}" run testers-documentation || echo "testers-documentation script failed"

      - name: Test Environment Context Differences
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          v=py3.10
          echo "=== Environment Variables in Hatch Context ==="
          hatch --env "qa.${v}" run python -c "import os, sys; print('PATH:', os.environ.get('PATH')[:200] + '...'); print('PYTHONPATH:', getattr(sys, 'path', 'None')[:5])"

          echo "=== Module Import Context Test ==="
          hatch --env "qa.${v}" run python -c "import sys; print('Python executable:', sys.executable)"
          hatch --env "qa.${v}" run python -c "import sphinx.cmd.build; print('Direct import success')" || echo "Direct import failed"

  test:
    needs: [initialize, debug-windows]
    if: always() && needs.initialize.result == 'success' && (needs.debug-windows.result == 'success' || needs.debug-windows.result == 'skipped')
    uses: emcd/python-project-common/.github/workflows/xrepo--tester.yaml@gha-1
    with:
      matrix-exclusions: '${{ needs.initialize.outputs.matrix-exclusions }}'
      platforms: '${{ needs.initialize.outputs.platforms }}'
      python-descriptors: '${{ needs.initialize.outputs.python-descriptors }}'
      python-versions: '${{ needs.initialize.outputs.python-versions }}'

  report:
    needs: [initialize, test]
    uses: emcd/python-project-common/.github/workflows/xrepo--reporter.yaml@gha-1
    with:
      python-version: '${{ fromJSON(needs.initialize.outputs.python-versions)[0] }}'
