name: qa

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['master', 'release-*']
  workflow_dispatch: {}

jobs:

  initialize:
    uses: ./.github/workflows/core--initializer.yaml

  debug-windows:
    needs: [initialize]
    if: contains(fromJSON(needs.initialize.outputs.platforms), 'windows-latest')
    runs-on: windows-latest
    steps:

      - name: Prepare Python
        uses: emcd/python-project-common/.github/actions/python-hatch@master
        with:
          python-version: '3.10'

      - name: Debug Environment
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          v=py3.10

          echo "=== Python Environment Debug ==="
          python --version
          which python

          echo "=== Hatch Environment Debug ==="
          hatch env show qa.${v}

          echo "=== Module Resolution Test ==="
          hatch --env "qa.${v}" run python -c "import sphinx.cmd.build; print('Sphinx module found')" || echo "Sphinx import failed"
          hatch --env "qa.${v}" run python -m sphinx.cmd.build --version || echo "Sphinx module execution failed"

          echo "=== Coverage + Sphinx Test ==="
          hatch --env "qa.${v}" run coverage --version
          hatch --env "qa.${v}" run coverage run -c "import sphinx.cmd.build; print('Coverage + Sphinx works')" || echo "Coverage + Sphinx failed"

          echo "=== Optional Dependencies Check ==="
          hatch --env "qa.${v}" run python -c "import magic; print('python-magic available')" || echo "python-magic not available"
          hatch --env "qa.${v}" run python -c "import puremagic; print('puremagic available')" || echo "puremagic not available"

      - name: Test Sphinx Without Coverage
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          v=py3.10
          hatch --env "qa.${v}" run python -m sphinx.cmd.build \
            -E -b doctest -d .auxiliary/caches/sphinx --quiet \
            documentation .auxiliary/artifacts/sphinx-doctest

      - name: Test Coverage + Sphinx Direct
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          v=py3.10
          echo "=== Testing Coverage + Sphinx Direct Command ==="
          hatch --env "qa.${v}" run coverage run -m sphinx.cmd.build \
            -E -b doctest -d .auxiliary/caches/sphinx --quiet \
            documentation .auxiliary/artifacts/sphinx-doctest || echo "Coverage + Sphinx direct failed"

      - name: Test Hatch Script Context
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          v=py3.10
          echo "=== Testing Hatch Script Execution ==="
          hatch --env "qa.${v}" run testers-documentation || echo "testers-documentation script failed"

      - name: Test Environment Context Differences
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          v=py3.10
          echo "=== Environment Variables in Hatch Context ==="
          hatch --env "qa.${v}" run python -c "import os, sys; print('PATH:', os.environ.get('PATH')[:200] + '...'); print('PYTHONPATH:', getattr(sys, 'path', 'None')[:5])"

          echo "=== Module Import Context Test ==="
          hatch --env "qa.${v}" run coverage run -c "import sphinx.cmd.build; print('Coverage + import success')" || echo "Coverage + import failed"

  test:
    needs: [initialize, debug-windows]
    if: always() && needs.initialize.result == 'success' && (needs.debug-windows.result == 'success' || needs.debug-windows.result == 'skipped')
    uses: emcd/python-project-common/.github/workflows/xrepo--tester.yaml@gha-1
    with:
      matrix-exclusions: '${{ needs.initialize.outputs.matrix-exclusions }}'
      platforms: '${{ needs.initialize.outputs.platforms }}'
      python-descriptors: '${{ needs.initialize.outputs.python-descriptors }}'
      python-versions: '${{ needs.initialize.outputs.python-versions }}'

  report:
    needs: [initialize, test]
    uses: emcd/python-project-common/.github/workflows/xrepo--reporter.yaml@gha-1
    with:
      python-version: '${{ fromJSON(needs.initialize.outputs.python-versions)[0] }}'
